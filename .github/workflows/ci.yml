
name: CAP-46 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. Spring Boot backend tests
  backend-tests:
    name: Backend - Maven Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: mvn -B -f backend/pom.xml clean verify

  # 2. React frontend checks
  frontend-build:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build React application
        working-directory: frontend
        run: npm run build

  # 3. Docker-based integration tests
  integration-tests:
    name: Integration - Docker and Pytest
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl --silent --fail http://localhost/api/health; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for application... ($i/60)"
            sleep 5
          done
          echo "Application did not become healthy."
          docker compose logs
          exit 1

      - name: Validate Nginx configuration
        run: bash scripts/bash/validate-nginx.sh nginx/candidates/baseline.conf

      - name: Run Python integration tests
        run: python -m pytest -v

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down
