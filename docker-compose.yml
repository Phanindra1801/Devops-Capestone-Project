
services:
  mysql:
    image: mysql:8.4
    container_name: cap46-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cap46_db
      MYSQL_USER: cap46_user
      MYSQL_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cap46-backend
    init: true
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cap46_db
      DB_USERNAME: cap46_user
      DB_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: cap46-nginx
    restart: unless-stopped

    ports:
    - "127.0.0.1:80:80"
    - "[::1]:80:80"
    volumes:
      - ./nginx/active/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
