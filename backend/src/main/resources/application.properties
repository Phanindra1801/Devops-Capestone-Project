# Application Configuration
spring.application.name=cap46-backend

# Server Configuration
server.port=8080


spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:cap46_db}
spring.datasource.username=${DB_USERNAME:cap46_user}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
	

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# JSON Configuration
spring.jackson.serialization.indent-output=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.cap46.backend=DEBUG
logging.file.name=logs/cap46-backend.log

# Application Information
info.app.name=CAP-46
info.app.description=Nginx Reverse Proxy Failure Isolation
info.app.version=1.0.0